name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify (typecheck, lint, test, build)
        run: npm run verify

      - name: Start production preview
        run: |
          npm run preview &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              echo "Preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview failed to become ready"
          exit 1

      - name: Browser smoke
        run: npm run test:smoke

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then
            kill "$(cat /tmp/preview.pid)" 2>/dev/null || true
          fi

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: artifacts/
          if-no-files-found: ignore
